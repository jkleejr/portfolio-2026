<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="466"  viewBox="0 0 750 466" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The pricing fork. After a photo is uploaded, the app asks whether the item is handmade or an original piece. If no, it is a resale item priced from training data, with no further step. If yes, it is an original with no fixed secondhand catalog, so one web search finds the asking price of comparable work. Both paths end in an item valuation.">
          <defs>
            <marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#a3b8e8"></path>
            </marker>
          </defs>
  <!-- Background plate. Delete this one line for a transparent SVG. -->
  <rect x="0" y="0" width="750" height="466" fill="#0a0a0a"></rect>
          <rect x="275" y="16" width="210" height="54" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="380" y="38" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">iOS App</text>
          <text x="380" y="56" fill="#b6b6b6" font-size="10.5" text-anchor="middle">user captures and uploads photo</text>
          <line x1="380" y1="70" x2="380" y2="103" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></line>

          <rect x="260" y="109" width="240" height="40" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="380" y="134" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">Handmade / Original piece?</text>

          <polyline points="260,129 180,129 180,186" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></polyline>
          <text x="220" y="120" fill="#9b9b9b" font-size="10.5" text-anchor="middle">no</text>

          <polyline points="500,129 580,129 580,186" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></polyline>
          <text x="540" y="120" fill="#9b9b9b" font-size="10.5" text-anchor="middle">yes</text>

          <rect x="80" y="192" width="200" height="54" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="180" y="214" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">Resale</text>
          <text x="180" y="232" fill="#b6b6b6" font-size="10.5" text-anchor="middle">priced from training data</text>

          <rect x="480" y="192" width="200" height="54" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="580" y="214" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">Original</text>
          <text x="580" y="232" fill="#b6b6b6" font-size="10.5" text-anchor="middle">no fixed secondhand catalog</text>
          <line x1="580" y1="246" x2="580" y2="290" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></line>

          <rect x="455" y="296" width="250" height="54" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="580" y="318" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">Web Search</text>
          <text x="580" y="334" fill="#b6b6b6" font-size="10.5" text-anchor="middle">finds asking price of comparable work</text>

          <polyline points="180,246 180,426 294,426" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></polyline>
          <polyline points="580,350 580,426 466,426" fill="none" stroke="#c9c9c9" stroke-width="1.1" marker-end="url(#m4)"></polyline>

          <rect x="300" y="406" width="160" height="40" rx="2" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1"></rect>
          <text x="380" y="431" fill="#ededed" font-size="13" font-weight="500" text-anchor="middle">Item Valuation</text>
        </svg>
